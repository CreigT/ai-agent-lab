name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python source
        run: python -m compileall -q .

      - name: Run tests when present
        shell: bash
        run: |
          if [ -d tests ]; then
            python -m unittest discover -s tests -v
          else
            echo "No tests directory yet; compile verification completed."
          fi
